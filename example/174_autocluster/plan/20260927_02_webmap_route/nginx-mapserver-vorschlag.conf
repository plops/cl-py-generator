# Vorschlag: nginx-Anbindung für mapserver (NICHT anwenden — nur Datei!)

Scope: reiner Config-Vorschlag für später. Kein Server-Eingriff in diesem Auftrag.
Referenz: `plan/nginx.conf` (`/` → 127.0.0.1:5001, gzip aktiv).

## Annahme

`mapserver` läuft lokal als eigener Dienst (z. B. systemd-Unit) auf 127.0.0.1:8080.
Die Routen (`/map`, `/api/map/*`, `/healthz`) werden **pfadgleich** durchgereicht
(kein Rewrite nötig, da mapserver absolute Pfade erwartet).

## Snippet (in den 443er `server`-Block von rocketrecap.com einfügen, VOR `location /`)

```nginx
# mapserver: Cluster-Karte (standalone-validiert, Port 8080)
location /map {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/map/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Punkte-JSON (~700 KB) profitiert stark von gzip (Typ application/json
    # ist in der Referenz-config bereits enthalten — nichts zu ändern).
}
```

## Hinweise

1. `X-Real-IP`/`X-Forwarded-For` werden gesetzt, weil das Rate-Limit später pro
   Client-IP greifen soll. Der Prototyp nutzt Peer-IP-Keying (lokal korrekt);
   vor Produktivnahme den Governor-Key-Extractor auf X-Forwarded-For umstellen
   (s. Walkthrough, Übernahme-Notiz) — sonst teilen sich alle Besucher einen Bucket.
2. `/healthz` bewusst NICHT exponiert (nur lokal für Monitoring/Smoke).
3. Alternative (falls Pfadkollision mit rs-summarizer): eigene Subdomain
   (z. B. `karte.rocketrecap.com`) mit eigenem `server`-Block nach dem Muster von
   `jobs.rocketrecap.com` aus der Referenz-config.
