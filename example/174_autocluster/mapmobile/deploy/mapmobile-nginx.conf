# mapmobile unter rocketrecap.com — KEINE eigene Site, sondern zwei location-Blöcke
# im 443er rocketrecap.com-Block von /etc/nginx/nginx.conf (direkt vor
# `location /`, das an rs-summarizer :5001 geht). Quelle: plan/nginx.conf
# ist das 1:1-Abbild der Live-Config; dort pflegen, hochladen, reload.
#
# Pfade kollidieren nicht mit rs-summarizer
# (/, /browse, /search, /generations/*, /summaries/*, /static/*,
# /process_transcript).

location = /karte {
    proxy_pass http://127.0.0.1:8080/map;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Pflicht: davon haengt das Pro-Nutzer-Rate-Limit der Karte ab!
    # $remote_addr (nicht append): sonst koennte jeder per eigenem
    # X-Forwarded-For-Header das Limit umgehen (SmartIp liest links).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /api/map/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
