# /etc/iwd/main.conf (ThinkPad E14 only)
#
# iwd owns wlan0 completely: association, DHCP and DNS.
# Do not run dhclient, dhcpcd or NetworkManager on wlan0 in parallel.
# See doc/hotspot_disconnect_report.md.
#
# Note: iwd only accepts comments at the start of a line. A trailing
# "# ..." after a value becomes part of the value and silently breaks it.

[General]
# Built-in DHCP client, reconnects automatically after hotspot restarts
EnableNetworkConfiguration=true
# Use the permanent MAC when connecting, so the DHCP server recognises us
AddressRandomization=disabled

[Network]
# Requires net-dns/openresolv
NameResolvingService=resolvconf
