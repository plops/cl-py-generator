# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-O2 -march=znver3 -pipe"
CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C target-cpu=znver3"

# NOTE: This stage was built with the bindist USE flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.UTF-8

MAKEOPTS="-j32"
EMERGE_DEFAULT_OPTS="--jobs=32 --load-average=32 " # --binpkg-respect-use=y"

USE="-vaapi -doc -cups -opencl -jemalloc -wayland pipewire dbus elogind policykit udev "
VIDEO_CARDS="nvidia radeonsi amdgpu"
LLVM_TARGETS="X86 NVPTX AMDGPU"

ACCEPT_LICENSE="*"


FEATURES="-ipc-sandbox -network-sandbox -pid-sandbox"

# Appending getbinpkg to the list of values within the FEATURES variable
FEATURES="${FEATURES} getbinpkg"
# Require signatures
FEATURES="${FEATURES} binpkg-request-signature"

GENTOO_MIRRORS="https://pkg.adfinis-on-exoscale.ch/gentoo/ \
    http://pkg.adfinis-on-exoscale.ch/gentoo/ \
    https://ch.mirrors.cicku.me/gentoo/ \
    http://ch.mirrors.cicku.me/gentoo/ \
    https://mirror.init7.net/gentoo/ \
    http://mirror.init7.net/gentoo/ \
    rsync://mirror.init7.net/gentoo/"
