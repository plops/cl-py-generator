# Minimal-Testsystem (openrc2): gleiche Basis wie openrc/, aber ohne X11,
# ohne Hardware-Treiber und ohne schwere Desktop-Pakete. Siehe ../openrc/config/make.conf.
COMMON_FLAGS="-O2 -march=znver3 -pipe"
CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3 vpclmulqdq"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C target-cpu=znver3"

LC_MESSAGES=C.UTF-8

MAKEOPTS="-j32"
EMERGE_DEFAULT_OPTS="--jobs=32 --load-average=32"

# Kein X, kein Wayland, kein VA-API/OpenCL: reines Konsolen-Testimage.
USE="-X -xinerama -wayland -vaapi -opencl -doc -cups -jemalloc pipewire dbus elogind policykit udev alsa"
# Kein Xorg -> keine VIDEO_CARDS. LLVM nur fuer X86 (kein AMDGPU/NVPTX):
# mesa/nvidia/rust sind nicht im Tree, daher wird llvm-core/llvm (~395 MiB)
# gar nicht erst gezogen; der Build verifiziert das via packages.tsv.
LLVM_TARGETS="X86"

ACCEPT_LICENSE="*"

FEATURES="-ipc-sandbox -network-sandbox -pid-sandbox"

# Appending getbinpkg to the list of values within the FEATURES variable
FEATURES="${FEATURES} getbinpkg"
# Require signatures
FEATURES="${FEATURES} binpkg-request-signature"

GENTOO_MIRRORS="https://pkg.adfinis-on-exoscale.ch/gentoo/ \
    http://pkg.adfinis-on-exoscale.ch/gentoo/ \
    https://ch.mirrors.cicku.me/gentoo/ \
    http://ch.mirrors.cicku.me/gentoo/ \
    https://mirror.init7.net/gentoo/ \
    http://mirror.init7.net/gentoo/ \
    rsync://mirror.init7.net/gentoo/"
